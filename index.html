<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para vos ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --crema:#fdf8f1; --texto:#2b1d1d; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--crema); color:var(--texto); font-family:'Inter', sans-serif; overflow:hidden;}
  h1,h2{font-family:'Instrument Serif', serif; font-weight:400;}
  .hearts{position:fixed; inset:0; pointer-events:none; z-index:0;}
  .heart{position:absolute; bottom:-20px; animation:float 6s linear infinite; opacity:0.6;}
  @keyframes float{0%{transform:translateY(0) rotate(0deg) scale(0.8); opacity:0}100%{transform:translateY(-110vh) rotate(360deg) scale(1.3); opacity:0}}
  
  .screen{min-height:100vh; width:100%; display:flex; justify-content:center; align-items:center; flex-direction:column; text-align:center; padding:30px; position:relative; z-index:2;}
  #p1 h1{font-size:3.2rem; max-width:380px; line-height:1.05; margin:0 0 30px 0;}
  #p1 h1 i{font-style:italic; color:#ff4d7a;}
  .btns{position:relative; width:300px; height:80px; display:flex; justify-content:center; align-items:center;}
  
  button{padding:16px 36px; border-radius:100px; border:none; font-size:1.1rem; font-weight:500; cursor:pointer; font-family:'Inter', sans-serif;}

  #yes{
    background:var(--texto); color:white;
    transition: transform 0.3s ease;
    z-index:5;
  }
  #no{
    background:white; color:var(--texto); border:1px solid #eee;
    position: fixed; /* ESTO HACE QUE CORRA POR TODA LA PANTALLA */
    top: 60%;
    left: 55%;
    z-index: 10;
    transition: all 0.25s ease;
  }

  #menu{display:none;} 
  #menu h1{font-size:2.8rem; margin:0;} 
  #menu p{opacity:0.6; margin:10px 0 30px 0;}
  .grid{display:flex; gap:16px; flex-wrap:wrap; justify-content:center;}
  .card{width:110px; background:white; border-radius:24px; padding:22px 10px; box-shadow:0 8px 30px rgba(0,0,0,0.06); cursor:pointer;}
  .card span{font-size:32px; display:block; margin-bottom:8px;} 
  .card b{font-family:'Instrument Serif', serif; font-size:1.25rem; font-weight:400;}
  
  .seccion{display:none; position:fixed; inset:0; background:var(--crema); z-index:20; overflow-y:auto; padding:40px 24px;}
  .seccion-cont{max-width:420px; margin:0 auto; text-align:center;}
  .seccion img{width:100%; border-radius:24px; margin:12px 0;}
  .carta-texto{background:white; border-radius:24px; padding:30px; text-align:left; line-height:1.7;}
  .volver{margin-top:30px; background:var(--texto); color:white; width:100%;}
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="screen" id="p1">
  <h1>¿Querés ser <br><i>mi persona para siempre?</i> ♡</h1>
  <div class="btns">
    <button id="yes">Sí</button>
  </div>
  <button id="no">No</button>
</div>

<div class="screen" id="menu">
  <h1>Sabía que ibas a decir <i>que sí!</i></h1>
  <p>Te hice 3 sorpresitas</p>
  <div class="grid">
    <div class="card" onclick="abrir('carta')"><span>💌</span><b>Carta</b></div>
    <div class="card" onclick="abrir('fotos')"><span>📸</span><b>Fotos</b></div>
    <div class="card" onclick="abrir('cancion')"><span>🎧</span><b>Canción</b></div>
  </div>
</div>

<div class="seccion" id="carta"><div class="seccion-cont"><h2>Mi carta</h2><div class="carta-texto">Acá va tu carta...</div><button class="volver" onclick="volver()">← Volver</button></div></div>
<div class="seccion" id="fotos"><div class="seccion-cont"><h2>Fotos</h2><img src="fotos/foto1.jpg"><img src="fotos/foto2.jpg"><button class="volver" onclick="volver()">← Volver</button></div></div>
<div class="seccion" id="cancion"><div class="seccion-cont"><h2>Canción</h2><iframe width="100%" height="220" src="https://www.youtube.com/embed/3JWTaaS7LdU"></iframe><button class="volver" onclick="volver()">← Volver</button></div></div>

<script>
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  let escala = 1;

  function mover() {
    // Calcula un lugar random DENTRO de la pantalla
    const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
    const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
    
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    // El SI crece
    escala += 0.15;
    yesBtn.style.transform = `scale(${escala})`;
  }

  noBtn.addEventListener('mouseenter', mover);
  noBtn.addEventListener('click', mover);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); mover(); });

  yesBtn.addEventListener('click', () => {
    document.getElementById('p1').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    noBtn.style.display = 'none'; // solo desaparece cuando ya dijo que SI
  });

  function abrir(id){ document.getElementById('menu').style.display='none'; document.getElementById(id).style.display='block'; }
  function volver(){ document.querySelectorAll('.seccion').forEach(s=>s.style.display='none'); document.getElementById('menu').style.display='flex'; }

  // corazones
  const heartsCont = document.getElementById('hearts');
  setInterval(()=>{
    const h=document.createElement('div'); h.className='heart'; h.innerText='♡';
    h.style.left=Math.random()*100+'vw'; h.style.fontSize=(14+Math.random()*20)+'px';
    heartsCont.appendChild(h); setTimeout(()=>h.remove(),6000);
  },350);
</script>
</body>
</html>
